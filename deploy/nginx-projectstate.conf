# /etc/nginx/sites-available/projectstate
limit_req_zone $binary_remote_addr zone=ps_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ps_mcp:10m rate=300r/m;

# Port 80 serves the app too (no redirect): the hosting gateway (Traefik) may terminate TLS for a hostname and forward
# plain HTTP to this port. Direct HTTPS on 443 below is used when 443 is forwarded to this VM.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # Behind Cloudflare Tunnel: cloudflared connects from localhost, so trust it and take the
    # real client IP from CF-Connecting-IP. Makes per-IP rate limiting and logging see the agent, not Cloudflare.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    access_log /var/log/nginx/projectstate.access.log;
    error_log  /var/log/nginx/projectstate.error.log;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    include /etc/nginx/snippets/projectstate-proxy.conf;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/projectstate/fullchain.pem;
    ssl_certificate_key /etc/ssl/projectstate/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    access_log /var/log/nginx/projectstate.access.log;
    error_log  /var/log/nginx/projectstate.error.log;

    include /etc/nginx/snippets/projectstate-proxy.conf;
}
